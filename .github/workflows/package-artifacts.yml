name: Package artifacts

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - ".github/workflows/package-artifacts.yml"
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/package-artifacts.yml"
  workflow_dispatch:

jobs:
  npm:
    name: npm tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build packages
        working-directory: typescript
        run: pnpm build
      - name: Create npm tarballs
        working-directory: typescript
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @hediet/linkrpc pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @hediet/linkrpc-hub pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          pnpm --filter @hediet/linkrpc-cli pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: artifacts/npm/*.tgz
          if-no-files-found: error
