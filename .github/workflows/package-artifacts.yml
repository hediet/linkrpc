name: Packages

on:
  push:
    branches: [main]
    paths:
      - "typescript/**"
      - "interop/**"
      - "rust/**"
      - "conformance/**"
      - "scripts/**"
      - ".github/actions/upload-release/**"
      - ".github/workflows/package-artifacts.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "typescript/**"
      - "interop/**"
      - "rust/**"
      - "conformance/**"
      - "scripts/**"
      - ".github/actions/upload-release/**"
      - ".github/workflows/package-artifacts.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    name: Check Rust and TypeScript, then package candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install release tools
        working-directory: scripts
        run: npm ci --ignore-scripts
      - name: Test release generation
        run: node --test scripts/*.test.mjs
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: typescript/.turbo
          key: ${{ runner.os }}-turbo-typescript-${{ hashFiles('typescript/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typescript-${{ hashFiles('typescript/pnpm-lock.yaml') }}-
      - name: Rust format
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace --locked
      - name: TypeScript build and tests
        working-directory: typescript
        run: pnpm check
      - name: Check Rust-exported streaming contract
        run: node interop/generate-streaming.mjs --check
      - name: Test typed Rust and TypeScript streaming in both directions
        working-directory: typescript
        env:
          LINKRPC_STREAMING_INTEROP: "1"
        run: pnpm --filter @hediet/linkrpc test src/connection/streamingInterop.test.ts
      - name: Verify conformance vectors
        run: |
          npm --prefix conformance/generate run gen
          git diff --exit-code -- conformance/vectors
      - name: Create candidates (not publication artifacts)
        run: node scripts/release-pack.mjs candidates
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-packages
          path: |
            artifacts/candidates/candidates.json
            artifacts/candidates/*.tgz
            artifacts/candidates/*.crate
          if-no-files-found: error
          retention-days: 90
