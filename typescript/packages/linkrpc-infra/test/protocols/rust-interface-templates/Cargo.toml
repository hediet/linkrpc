[package]
name = "linkrpc-interface-templates-interop"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "interface-templates-peer"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
linkrpc = { path = "../../../../../../rust/crates/linkrpc" }
linkrpc-tokio = { path = "../../../../../../rust/crates/linkrpc-tokio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "time"] }

[build-dependencies]
linkrpc = { path = "../../../../../../rust/crates/linkrpc" }
serde_json = "1"
