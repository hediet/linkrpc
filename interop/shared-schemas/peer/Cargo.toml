[package]
name = "shared-schemas-peer"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
async-trait = "0.1"
linkrpc = { path = "../../../rust/crates/linkrpc" }
linkrpc-tokio = { path = "../../../rust/crates/linkrpc-tokio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared-schemas-contract = { path = "../contract" }
tokio = { version = "1", features = ["io-std", "macros", "rt", "time"] }

[build-dependencies]
linkrpc = { path = "../../../rust/crates/linkrpc" }
serde_json = "1"
shared-schemas-contract = { path = "../contract" }
