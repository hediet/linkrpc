[package]
name = "linkrpc-typed-errors-compile-fail"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
linkrpc = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
async-trait = "0.1"

[[bin]]
name = "reserved"
path = "reserved.rs"

[[bin]]
name = "duplicate"
path = "duplicate.rs"

[[bin]]
name = "empty_name"
path = "empty_name.rs"

[[bin]]
name = "cancelled"
path = "cancelled.rs"

[[bin]]
name = "wrong_payload"
path = "wrong_payload.rs"

[[bin]]
name = "undeclared_error"
path = "undeclared_error.rs"

[[bin]]
name = "missing_imported_member"
path = "missing_imported_member.rs"

[[bin]]
name = "client_only_event"
path = "client_only_event.rs"

[[bin]]
name = "wrong_binding_provider"
path = "wrong_binding_provider.rs"

[[bin]]
name = "immutable_binding"
path = "immutable_binding.rs"
