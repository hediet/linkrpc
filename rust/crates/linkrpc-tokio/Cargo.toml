[package]
name = "linkrpc-tokio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tokio transports for LinkRPC over local sockets, NDJSON, and WebSockets"
publish = true

[dependencies]
linkrpc = { version = "0.3.0", path = "../linkrpc" }
tokio = { workspace = true, features = ["process", "io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.32"
getrandom = "0.3"
url.workspace = true

[dev-dependencies]
futures-util = "0.3.32"
schemars = { workspace = true }
serde = { workspace = true }
tokio-tungstenite = "0.29.0"
